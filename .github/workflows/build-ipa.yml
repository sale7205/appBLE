name: Build iPhone app (.ipa for Sideloadly)

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/build-ipa.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned, Sideloadly signs it)
        working-directory: ios
        run: |
          xcodebuild -project WaveRider.xcodeproj -scheme WaveRider -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/WaveRider.app Payload/
          zip -qry WaveRider.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: WaveRider-ipa
          path: ios/WaveRider.ipa
